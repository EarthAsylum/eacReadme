name: Deploy to WordPress.org SVN
on:
  release:
    types: [released]

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Plugin-Slug
      # convert REPO_NAME to lower case as SLUG used by deploy
      run: |
        echo "SLUG=${REPO_NAME,,}" >>${GITHUB_ENV}

    - name: Checkout-Code
      # checkout the repository code
      uses: actions/checkout@v7

    - name: WordPress-Deploy
      # deploy to WordPress, creating a WP installable .zip
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: true
      env:
        ASSETS_DIR: .wp-assets
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}

    - name: Upload-Release-Asset
      # Upload {plugin-name}.zip to github release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ github.workspace }}/${{ env.SLUG }}.zip
        # ${{ github.event.repository.name }}.zip
